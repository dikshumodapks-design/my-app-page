<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIKSHA STORE 09</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0f172a;
            color: #ffffff;
            padding: 20px 15px;
            margin: 0;
        }

        /* Floating & Glowing Title Animation */
        .store-header {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff007f, #00f0ff, #ff007f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 2s linear infinite, float 3s ease-in-out infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .notice-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border: 1px solid #334155;
            font-size: 14px;
            color: #cbd5e1;
        }

        /* App Card Layout */
        .app-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            max-width: 350px;
            margin: 0 auto 20px auto;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.4);
            border: 1px solid #334155;
        }

        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            margin: 8px 0;
            color: #ffffff;
        }

        .download-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 24px;
            background: linear-gradient(45deg, #ef4444, #dc2626);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            transition: transform 0.2s;
        }

        .download-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Floating Glowing Store Header -->
    <div class="store-header">
        DIKSHA STORE 09
    </div>

    <!-- Live Notice -->
    <div class="notice-box">
        Update aane par app delete na karein, online update ho jayegi.
    </div>

    <!-- Pocket FM Card -->
    <div class="app-card">
        <img class="banner-img" src="https://via.placeholder.com/350x150/ff4f00/ffffff?text=Pocket+FM" alt="Pocket FM Banner">
        <div class="app-title">Pocket FM</div>
        <a href="YOUR_POCKET_FM_LINK_HERE" class="download-btn">Download Now</a>
    </div>

    <!-- Kuku TV Card -->
    <div class="app-card">
        <img class="banner-img" src="https://via.placeholder.com/350x150/8b5cf6/ffffff?text=Kuku+TV" alt="Kuku TV Banner">
        <div class="app-title">Kuku TV</div>
        <a href="YOUR_KUKU_TV_LINK_HERE" class="download-btn">Download Now</a>
    </div>

</body>
</html>
